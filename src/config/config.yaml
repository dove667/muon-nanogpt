# Fixed experiment config — shared across all runs.

training:
  tokens_per_step: 131072        # total tokens per optimizer step
  seq_len: 2048
  grad_accum_steps: 16
  warmup_frac: 0.10
  min_lr_frac: 0.10
  val_ppl_max: 20.0

  # Controlled experiment variables
  train_token_budget: 100_000_000
  eval_interval_tokens: 2_000_000
  eval_tokens: 524_288
  log_every_steps: 20

  spectral_interval_tokens: 10_000_000
  spectral_num_matrices: 5
  spectral_dim_cap: 1024

model:
  vocab_size: 50257
  num_layers: 11
  num_heads: 6
  head_dim: 128
  model_dim: 768
  mlp_ratio: 4

optimizer:
  lr_mul: 1.0                   # global LR multiplier for muon params
  adam_beta1: 0.9
  adam_beta2: 0.95

  base_lr_adamw: 0.008
  adam_defaults:
    lr: 0.008
    eps: 1.0e-10
    weight_decay: 0.005

  base_lr_muon: 0.023
  muon_defaults:
    lr: 0.023
    momentum: 0.95
    beta2: 0.9
    weight_decay: 1.2

orthogonalization:
  default_iterations: 5
  ns_iterations: 5              # Newton-Schulz iterations for vanilla/fast/polar_express

  fast_steps: 3                 # manual mode default
  stable_steps: 2               # manual mode default

  pe_lower_bound: "1e-3"
  pe_cushion: 0.02
  pe_safety_factor: 0.02
